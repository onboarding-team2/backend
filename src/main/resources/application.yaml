server:
  servlet:
    context-path: /api

spring:
  application:
    name: onboarding

  datasource:
    url: jdbc:mysql://localhost:3306/onboarding
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect